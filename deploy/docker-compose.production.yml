services:
  nginx:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      PLANER_DOMAIN: ${PLANER_DOMAIN}
      INFRA_DOMAIN: ${INFRA_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [public, internal]

  api:
    image: ${API_IMAGE}
    command: ["server"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-15m}
      INVITATION_TOKEN_SECRET: ${INVITATION_TOKEN_SECRET}
      INVITE_PUBLIC_BASE_URL: ${INVITE_PUBLIC_BASE_URL}
      INVITE_TTL: ${INVITE_TTL:-168h}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-clinks_session}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_CALLBACK_URL: ${GOOGLE_OIDC_CALLBACK_URL:-}
      OIDC_STATE_SECRET: ${OIDC_STATE_SECRET:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/clinks-server", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [internal]

  worker:
    image: ${API_IMAGE}
    entrypoint: ["/app/clinks-worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      INVITATION_TOKEN_SECRET: ${INVITATION_TOKEN_SECRET}
      INVITE_PUBLIC_BASE_URL: ${INVITE_PUBLIC_BASE_URL}
      INVITE_TTL: ${INVITE_TTL:-168h}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/clinks-worker", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [internal]

  migrate:
    image: ${API_IMAGE}
    command: ["migrate"]
    environment:
      DATABASE_URL: "postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_LOCALE: ${ADMIN_LOCALE:-de-CH}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  backup:
    image: ${BACKUP_IMAGE}
    profiles: ["maintenance"]
    env_file: ${ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]

networks:
  public: {}
  internal:
    internal: true

volumes:
  postgres-data: {}
