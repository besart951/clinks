# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
# Sync streams. Changes are not watched: restart the service after editing.
#
# Each stream syncs one table of the tenant in the access token (`tenant_id` claim), and only while the
# user's membership there is active and its role grants the read permission. Membership and role are
# read from the replicated tables, so a removed member stops syncing without waiting for a new token.

config:
  edition: 3
  timestamp_max_precision: milliseconds

streams:
  system:
    auto_subscribe: true
    queries:
      - SELECT * FROM system_status

  contacts:
    auto_subscribe: true
    query: |
      SELECT * FROM contacts WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'contacts.read' IN read_permissions
      )

  # Spitex visits are the plan and follow its release (below), not the calendar permission.
  appointments:
    auto_subscribe: true
    query: |
      SELECT * FROM appointments WHERE kind != 'spitex' AND tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'calendar.read' IN read_permissions
      )

  # Planners: the whole plan, drafts included.
  spitex_planning:
    auto_subscribe: true
    query: |
      SELECT * FROM appointments WHERE kind = 'spitex' AND tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'spitex.read' IN read_permissions
      )

  # Staff: their own visits of released weeks. `published` is set by triggers from spitex_week_releases, so
  # withdrawing a release or reassigning a visit removes it from the device.
  my_visits:
    auto_subscribe: true
    query: |
      SELECT * FROM appointments WHERE kind = 'spitex' AND published AND assignee_id = auth.user_id()
        AND tenant_id IN (
          SELECT tenant_id FROM sync_access
          WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
            AND 'spitex.own.read' IN read_permissions
        )

  # What staff need of the clients they visit: name, address and phone, nothing else of the record. It lands
  # in its own local table, so it never mixes with full contacts.
  visit_clients:
    auto_subscribe: true
    query: |
      SELECT id, tenant_id, kind, first_name, last_name, company_name, phone, address
      FROM contacts AS visit_clients WHERE id IN (
        SELECT a.contact_id FROM appointments a INNER JOIN sync_access s ON s.tenant_id = a.tenant_id
        WHERE a.kind = 'spitex' AND a.published AND a.assignee_id = auth.user_id()
          AND s.user_id = auth.user_id() AND s.tenant_id = auth.parameter('tenant_id')
          AND 'spitex.own.read' IN s.read_permissions
      )

  spitex_week_releases:
    auto_subscribe: true
    queries:
      - |
        SELECT * FROM spitex_week_releases WHERE tenant_id IN (
          SELECT tenant_id FROM sync_access
          WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
            AND 'spitex.read' IN read_permissions
        )
      - |
        SELECT * FROM spitex_week_releases WHERE tenant_id IN (
          SELECT tenant_id FROM sync_access
          WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
            AND 'spitex.own.read' IN read_permissions
        )

  folders:
    auto_subscribe: true
    query: |
      SELECT * FROM folders WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'documents.read' IN read_permissions
      )

  documents:
    auto_subscribe: true
    query: |
      SELECT * FROM documents WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'documents.read' IN read_permissions
      )

  invoices:
    auto_subscribe: true
    query: |
      SELECT * FROM invoices WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'finance.read' IN read_permissions
      )

  expenses:
    auto_subscribe: true
    query: |
      SELECT * FROM expenses WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'finance.read' IN read_permissions
      )

  tasks:
    auto_subscribe: true
    query: |
      SELECT * FROM tasks WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'planner.read' IN read_permissions
      )

  contact_comments:
    auto_subscribe: true
    query: |
      SELECT * FROM contact_comments WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'contacts.read' IN read_permissions
      )

  task_comments:
    auto_subscribe: true
    query: |
      SELECT * FROM task_comments WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
