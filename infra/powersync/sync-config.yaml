# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
# Sync streams. Changes are not watched: restart the service after editing.
#
# Each stream syncs one table of the tenant in the access token (`tenant_id` claim), and only while the
# user's membership there is active and its role grants the read permission. Membership and role are
# read from the replicated tables, so a removed member stops syncing without waiting for a new token.

config:
  edition: 3
  timestamp_max_precision: milliseconds

streams:
  system:
    auto_subscribe: true
    queries:
      - SELECT * FROM system_status

  contacts:
    auto_subscribe: true
    query: |
      SELECT * FROM contacts WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'contacts.read' IN read_permissions
      )

  appointments:
    auto_subscribe: true
    query: |
      SELECT * FROM appointments WHERE tenant_id IN (
        SELECT tenant_id FROM sync_access
        WHERE user_id = auth.user_id() AND tenant_id = auth.parameter('tenant_id')
          AND 'calendar.read' IN read_permissions
      )

