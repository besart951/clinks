# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
# Development configuration. `!env NAME` reads environment variables starting with PS_.

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # Phase 2 switches to the API's JWKS endpoint (jwks_uri) with EdDSA keys.
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: clinks-dev
        k: !env PS_DEV_JWT_SECRET
  audience: ['clinks-dev']

api:
  tokens:
    - !env PS_ADMIN_TOKEN
