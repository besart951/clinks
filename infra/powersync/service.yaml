# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
# Development configuration. `!env NAME` reads environment variables starting with PS_.

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # Access tokens are signed by the API (EdDSA); PowerSync fetches the public keys from its JWKS.
  jwks_uri: !env PS_JWKS_URI
  # The dev API runs on the host, a private address; production uses the public HTTPS URL.
  block_local_jwks: false
  audience: ['clinks']

api:
  tokens:
    - !env PS_ADMIN_TOKEN
