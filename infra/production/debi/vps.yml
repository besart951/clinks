services:
  api:
    networks: [default, database]
  collab:
    networks: [default, database]
  powersync:
    networks: [default, database]
    volumes:
      - /srv/clinks/config/powersync.yaml:/config/service.yaml:ro
  caddy:
    environment:
      APEX_HOST: ${APEX_HOST:?apex host required}
    networks:
      default: {}
      ingress:
        aliases: [clinks-web]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./debi/web-routes:/etc/caddy/web-routes:ro
      - ./debi/sites:/etc/caddy/sites:ro
      - /srv/codelinks/recovery-control/gate:/run/recovery:ro
      - /srv/codelinks/state/planer-downloads:/srv/planer-downloads:ro
networks:
  database:
    external: true
    name: clinks-database
  ingress:
    external: true
    name: clinks-ingress
