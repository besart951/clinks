name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (format, lint, types, unit tests, build)
    runs-on: ${{ github.event_name == 'push' && 'clinks-zep' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm audit --prod --audit-level=high

  integration:
    name: Integration (API + database)
    runs-on: ${{ github.event_name == 'push' && 'clinks-zep' || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: clinks
          POSTGRES_PASSWORD: clinks-dev
          POSTGRES_DB: clinks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clinks -d clinks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # The API's login role (no owner, no superuser), as in the dev init script.
      - run: psql postgres://clinks:clinks-dev@localhost:5432/clinks -v ON_ERROR_STOP=1 -f infra/postgres/init/02-api-role.sql
      - run: pnpm test:integration

  e2e:
    name: Browser tests (mock)
    runs-on: ${{ github.event_name == 'push' && 'clinks-zep' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push'
        run: pnpm --filter @clinks/web exec playwright install --with-deps chrome
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  e2e-remote:
    name: Browser tests (API, PowerSync, S3)
    runs-on: ${{ github.event_name == 'push' && 'clinks-zep' || 'ubuntu-latest' }}
    env:
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: clinks-e2e-documents
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: clinks
      AWS_SECRET_ACCESS_KEY: clinks-dev-secret
      WEB_ORIGIN: http://localhost:5176
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push'
        run: pnpm --filter @clinks/web exec playwright install --with-deps chrome
      # The dev stack; PowerSync starts after the migrations so its sync streams find their tables.
      - run: docker compose -f infra/compose.dev.yml up -d --wait postgres objects mail
      - run: pnpm db:migrate
      - run: docker compose -f infra/compose.dev.yml up -d --wait powersync
      - name: Create the versioned bucket
        working-directory: apps/api
        run: node src/init-bucket.ts
        env:
          S3_LOCK_MODE: GOVERNANCE
          S3_RETENTION_DAYS: '1'
      - name: Start the API
        working-directory: apps/api
        run: |
          nohup node src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 30); do curl -sf http://localhost:8787/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Start collaboration server
        working-directory: apps/collab
        run: |
          DATABASE_URL=postgres://clinks_api:clinks-api-dev@localhost:5432/clinks \
          JWKS_URL=http://localhost:8787/.well-known/jwks.json \
          TOKEN_ISSUER=http://localhost:8787 \
          PORT=1234 \
          nohup node src/main.ts > "$RUNNER_TEMP/collab.log" 2>&1 &
          for attempt in $(seq 1 30); do
            node -e "const n=require('net');const s=n.connect(1234,'127.0.0.1',()=>process.exit(0));s.on('error',()=>process.exit(1));s.setTimeout(1000,()=>process.exit(1))" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/collab.log"
          exit 1
      - run: pnpm --filter @clinks/web test:e2e:remote
        env:
          VITE_COLLAB_URL: ws://localhost:1234
      - if: failure()
        run: |
          cat "$RUNNER_TEMP/api.log"
          cat "$RUNNER_TEMP/collab.log" || true
          docker compose -f infra/compose.dev.yml logs --no-color --tail 200 powersync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-remote-results
          path: apps/web/test-results
          retention-days: 7

  deploy:
    name: Deploy to debi
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, integration, e2e, e2e-remote]
    runs-on: clinks-zep
    environment: production
    steps:
      - name: Check production configuration
        id: config
        shell: bash
        env:
          PROVIDERS: ${{ secrets.CLINKS_PROVIDER_ENV }}
        run: |
          if [[ -n "$PROVIDERS" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Deployment pending: add CLINKS_PROVIDER_ENV to the production environment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v6
      - name: Build production images
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          docker build -f infra/production/Dockerfile --target workspace -t "clinks-workspace:$GITHUB_SHA" .
          docker build -f infra/production/Dockerfile --target edge -t "clinks-edge:$GITHUB_SHA" \
            --build-arg API_ORIGIN=https://api.clinks.ch --build-arg SYNC_ORIGIN=https://sync.clinks.ch \
            --build-arg COLLAB_ORIGIN=wss://collab.clinks.ch .
      - name: Release images over SSH
        if: steps.config.outputs.ready == 'true'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          HOST_KEYS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          PROVIDERS: ${{ secrets.CLINKS_PROVIDER_ENV }}
        run: |
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$HOST_KEYS" > "$hosts"
          remote=(ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -i "$key" debian@83.228.246.96)
          printf '%s\n' "$PROVIDERS" | "${remote[@]}" "providers $GITHUB_SHA"
          docker save "clinks-workspace:$GITHUB_SHA" "clinks-edge:$GITHUB_SHA" | gzip -1 | "${remote[@]}" "release $GITHUB_SHA"
