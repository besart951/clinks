version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The browser contract deliberately reuses canonical Session, Empty, and
    # read-model messages instead of adding one-field RPC wrapper messages.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
