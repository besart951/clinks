<style id="page-css"></style>
<style>
html,body{margin:0;background:oklch(0.145 0 0)}
body.is-mobile{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top, oklch(0.22 0.02 265), oklch(0.12 0 0) 70%);padding:76px 0 32px;box-sizing:border-box}
#phone{display:none;width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;transform:translateZ(0);box-shadow:0 0 0 10px oklch(0.2 0 0),0 0 0 11px #ffffff22,0 30px 80px #000c}
body.is-mobile #phone{display:block}
body.is-mobile #desk{display:none}
#protobar{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:oklch(0.2 0 0 / 0.92);border:1px solid #ffffff24;box-shadow:0 10px 30px #0008;font:500 13px Roboto,system-ui,sans-serif;color:oklch(0.95 0 0);backdrop-filter:blur(8px)}
#protobar .seg{display:inline-flex;padding:2px;border-radius:10px;background:oklch(0.15 0 0)}
#protobar button{height:30px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:oklch(0.75 0 0);font:inherit;cursor:pointer}
#protobar button[aria-pressed="true"]{background:oklch(0.424 0.199 265.638);color:white}
#protobar select{height:32px;border-radius:9px;border:1px solid #ffffff24;background:oklch(0.15 0 0);color:inherit;font:inherit;padding:0 8px}
#protobar .tag{padding:0 6px 0 4px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:oklch(0.65 0 0)}
#flash{position:fixed;left:50%;top:64px;transform:translate(-50%,-20px);opacity:0;transition:all .2s;z-index:9999;padding:8px 14px;border-radius:10px;background:oklch(0.985 0 0);color:oklch(0.2 0.016 255);font:500 13px Roboto,sans-serif;pointer-events:none}
#flash.on{opacity:1;transform:translate(-50%,0)}
html{scroll-behavior:smooth}
:where(button,a,[role=button],input,select,textarea,label,summary){transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,opacity .16s ease,scale .14s ease}
:where(button,a[href],[role=button]):active:not(:disabled){scale:.975}
:where(svg){transition:color .16s ease,opacity .16s ease}
#desk aside:not([role]){transition:flex-basis .28s cubic-bezier(.2,.8,.2,1),max-width .28s cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root){animation:220ms cubic-bezier(.4,0,1,1) both pl-vt-out}
::view-transition-new(root){animation:380ms cubic-bezier(.2,.8,.2,1) 60ms both pl-vt-in}
@keyframes pl-vt-out{to{opacity:0;scale:.97}}
@keyframes pl-vt-in{from{opacity:0;scale:1.03}}
#protobar{view-transition-name:pl-bar}
#flash{view-transition-name:pl-flash}
#protobar button{transition:background-color .2s,color .2s}
#phone{transition:box-shadow .3s}
@media (prefers-reduced-motion:reduce){*,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){transition:none!important;animation:none!important}html{scroll-behavior:auto}}
#phone > div{width:100%!important;height:100%!important}
#phone > div > div[style*="height: 764px"]{height:calc(100% - 80px)!important}
#phone > div > div[style*="height: 844px"]{height:100%!important}
@media (max-width:600px){
  body.is-mobile{padding:0;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
  #phone{border-radius:0;box-shadow:none;width:100vw;height:calc(100dvh - 47px)}
  body.is-mobile #protobar{order:-1;position:sticky;top:0;left:0;transform:none;border-radius:0;border-width:0 0 1px;width:100%;box-sizing:border-box;justify-content:center;padding:6px 8px;gap:4px;view-transition-name:none}
  #protobar .tag{display:none}
  #protobar select{max-width:150px}
  #flash{top:56px}
}
</style>
</head>
