<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>LokaLink App – Ergebnisse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&amp;family=Roboto:wght@400..700&amp;family=Martian+Mono:wght@400..500&amp;display=swap">
<style>
body{margin:0;font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased}
a{color:oklch(0.7 0.14 264)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid oklch(0.7 0.14 264);outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: oklch(0.2 0.006 255); color: oklch(0.985 0 0); font-family: 'Roboto', sans-serif">

  <!-- Map -->
  <svg viewBox="0 0 390 460" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 460px">
    <g fill="none" stroke="oklch(0.26 0.008 255)"><path d="M-10 90 C80 70 160 120 400 80"></path><path d="M-10 170 C100 150 200 200 400 160"></path><path d="M-10 330 C120 300 220 360 400 320"></path><path d="M280 -10 C300 120 260 220 300 470"></path></g>
    <path d="M40 170 C70 140 130 150 150 190 C170 240 160 300 130 330 C100 350 60 340 50 300 C30 250 20 200 40 170Z" fill="oklch(0.27 0.035 240)"></path>
    <g fill="none" stroke="oklch(0.33 0.01 255)" stroke-width="3" stroke-linecap="round"><path d="M20 470 L60 330 L80 200 L110 -10"></path><path d="M150 200 C210 220 250 260 300 280 L400 260"></path></g>
    <g font-family="Roboto, sans-serif" font-size="11" fill="oklch(0.6 0 0)"><text x="62" y="250">Sarnersee</text><text x="24" y="140">Sachseln</text><text x="250" y="120">Melchtal</text></g>
  </svg>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
    <button type="button" onClick="{{p.pick}}" aria-label="{{p.label}}" style="{{p.style}}"></button>
  </sc-for>

  <!-- Top search -->
  <div style="position: absolute; left: 16px; right: 16px; top: 33px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 52px; border-radius: 16px; background: oklch(0.24 0 0); border: 1px solid #ffffff26; box-shadow: 0 4px 6px -1px #0000001a, 0 2px 4px -2px #0000001a; display: flex; align-items: center; gap: 4px; padding: 0 6px">
      <a href="AppHome.dc.html" aria-label="Zurück" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: oklch(0.985 0 0)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 500">Restaurants</span>
        <span style="font-size: 12px; color: oklch(0.75 0 0)">Rund um 6072 Sachseln</span>
      </span>
      <button type="button" aria-label="Filter" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto">
      <span style="flex: 0 0 auto; height: 34px; padding: 0 14px; border-radius: 9999px; background: oklch(0.985 0 0); color: oklch(0.19 0.012 264); font-size: 13px; font-weight: 500; display: flex; align-items: center">Bis 5 km</span>
      <span style="flex: 0 0 auto; height: 34px; padding: 0 14px; border-radius: 9999px; background: oklch(0.24 0 0); border: 1px solid #ffffff26; font-size: 13px; display: flex; align-items: center">Mit Telefon</span>
      <span style="flex: 0 0 auto; height: 34px; padding: 0 14px; border-radius: 9999px; background: oklch(0.24 0 0); border: 1px solid #ffffff26; font-size: 13px; display: flex; align-items: center">Mit Website</span>
      <span style="flex: 0 0 auto; height: 34px; padding: 0 14px; border-radius: 9999px; background: oklch(0.24 0 0); border: 1px solid #ffffff26; font-size: 13px; display: flex; align-items: center">Ganzjährig</span>
    </div>
  </div>

  <!-- Bottom sheet -->
  <section aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; top: 400px; bottom: 0; background: oklch(0.145 0 0); border-top-left-radius: 24px; border-top-right-radius: 24px; border-top: 1px solid #ffffff26; box-shadow: 0 10px 15px -3px #0000001a, 0 4px 6px -4px #0000001a; display: flex; flex-direction: column">
    <div aria-hidden="true" style="display: flex; justify-content: center; padding: 10px 0 6px"><span style="width: 40px; height: 4px; border-radius: 9999px; background: oklch(0.4 0 0)"></span></div>
    <div style="padding: 4px 20px 12px; display: flex; align-items: baseline; justify-content: space-between">
      <h1 id="sheet-title" style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 640; font-size: 20px; letter-spacing: -0.01em">6 Restaurants</h1>
      <span style="font-size: 13px; color: oklch(0.75 0 0)">Nach Entfernung</span>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0 16px 100px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <li>
          <div style="{{it.cardStyle}}">
            <span aria-hidden="true" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; background: oklch(0.78 0.14 60 / 0.14); color: oklch(0.78 0.14 60); display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 0-3 2-3 6s1 5 3 5v7"></path></svg>
            </span>
            <a href="AppProfile.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: oklch(0.985 0 0)">
              <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
              <span style="font-size: 13px; color: oklch(0.75 0 0)">{{it.place}}, {{it.dist}}</span>
            </a>
            <sc-if value="{{it.phone}}" hint-placeholder-val="{{true}}">
              <a href="#" aria-label="{{it.callLabel}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #ffffff26; display: flex; align-items: center; justify-content: center; color: oklch(0.985 0 0)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"></path></svg>
              </a>
            </sc-if>
          </div>
        </li>
      </sc-for>
    </ul>
  </section>

  <nav aria-label="App-Navigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 12px 24px; background: oklch(0.18 0 0); border-top: 1px solid #ffffff1f; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="AppHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none; color: oklch(0.75 0 0)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Suchen</a>
    <a href="AppResults.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none; color: oklch(0.7 0.14 264)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3ZM9 3v15M15 6v15"></path></svg>Karte</a>
    <a href="AppSaved.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none; color: oklch(0.75 0 0)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"></path></svg>Gemerkt</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none; color: oklch(0.75 0 0)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Konto</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 1 }; }
  renderVals() {
    const data = [
      { id: 1, name: 'Berggasthaus Aelggialp', place: 'Sachseln', dist: '1.1 km', x: 80, y: 190, phone: true },
      { id: 2, name: 'Bärgbeizli Cheselen', place: 'Sachseln', dist: '2.1 km', x: 175, y: 250, phone: true },
      { id: 3, name: 'Waldhaus Stöckalp', place: 'Stöckalp', dist: '2.2 km', x: 270, y: 165, phone: false },
      { id: 5, name: 'Frutt o Bene', place: 'Melchsee-Frutt', dist: '3.1 km', x: 300, y: 330, phone: false },
      { id: 7, name: 'Fuchs- und Hasenbeiz', place: 'Melchsee-Frutt', dist: '3.2 km', x: 240, y: 350, phone: true },
      { id: 10, name: 'Bergrestaurant Erzegg', place: 'Melchsee-Frutt', dist: '4.2 km', x: 340, y: 370, phone: true }
    ];
    const sel = this.state.sel;
    const pins = data.map(d => {
      const on = d.id === sel;
      const s = on ? 34 : 18;
      return {
        label: d.name + ' auswählen',
        pick: () => this.setState({ sel: d.id }),
        style: 'position: absolute; left: ' + (d.x - 22) + 'px; top: ' + (d.y - 22) + 'px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: ' + (on ? 3 : 1) + '; --s: ' + s + 'px; background-image: radial-gradient(circle, ' + (on ? 'oklch(0.424 0.199 265.638)' : 'oklch(0.78 0.14 60)') + ' ' + (s / 2 - 3) + 'px, ' + (on ? 'oklch(0.97 0.014 254.604)' : 'oklch(0.2 0.006 255)') + ' ' + (s / 2 - 3) + 'px, ' + (on ? 'oklch(0.97 0.014 254.604)' : 'oklch(0.2 0.006 255)') + ' ' + (s / 2) + 'px, transparent ' + (s / 2) + 'px)'
      };
    });
    const items = data.map(d => Object.assign({}, d, {
      callLabel: d.name + ' anrufen',
      cardStyle: 'display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: ' + (d.id === sel ? 'oklch(0.2731 0.0358 265.638)' : 'oklch(0.2 0 0)') + '; border: 1px solid ' + (d.id === sel ? 'oklch(0.7 0.14 264)' : '#ffffff1f')
    }));
    return { pins, items };
  }
}
</script>
</body>
</html>
