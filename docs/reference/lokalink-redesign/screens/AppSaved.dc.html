<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>LokaLink App – Gemerkt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&amp;family=Roboto:wght@400..700&amp;family=Martian+Mono:wght@400..500&amp;display=swap">
<style>
body{margin:0;font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased}
a{color:oklch(0.7 0.14 264)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid oklch(0.7 0.14 264);outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: oklch(0.145 0 0); color: oklch(0.985 0 0); font-family: 'Roboto', sans-serif">
  <div style="height: 760px; overflow-y: auto; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 650; font-size: 34px; letter-spacing: -0.035em">Gemerkt</h1>
      <p style="margin: 0; font-size: 14px; color: oklch(0.75 0 0)">Firmen, die du dir für später gespeichert hast.</p>
    </div>

    <div role="tablist" aria-label="Ansicht" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: oklch(0.2 0 0); border: 1px solid #ffffff1f">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{showFirms}}" hint-placeholder-val="{{true}}">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{firms}}" as="f" hint-placeholder-count="3">
          <li style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: oklch(0.2 0 0); border: 1px solid #ffffff1f">
            <span aria-hidden="true" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: {{f.tint}}; color: {{f.tone}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.icon}}"></path></svg>
            </span>
            <a href="AppProfile.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: oklch(0.985 0 0)">
              <span style="font-size: 15px; font-weight: 600">{{f.name}}</span>
              <span style="font-size: 13px; color: oklch(0.75 0 0)">{{f.cat}}, {{f.dist}}</span>
            </a>
            <button type="button" aria-label="{{f.removeLabel}}" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; color: oklch(0.78 0.14 60); display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"></path></svg>
            </button>
          </li>
        </sc-for>
      </ul>
    </sc-if>

    <sc-if value="{{showSearches}}" hint-placeholder-val="{{false}}">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{searches}}" as="s" hint-placeholder-count="3">
          <li>
            <a href="AppResults.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: oklch(0.2 0 0); border: 1px solid #ffffff1f; text-decoration: none; color: oklch(0.985 0 0)">
              <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: oklch(0.269 0 0); display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
              </span>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600">{{s.q}}</span>
                <span style="font-size: 13px; color: oklch(0.75 0 0)">{{s.where}}</span>
              </span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.75 0 0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
            </a>
          </li>
        </sc-for>
      </ul>
    </sc-if>
  </div>

  <nav aria-label="App-Navigation" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding: 8px 12px 24px; background: oklch(0.18 0 0); border-top: 1px solid #ffffff1f; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="AppHome.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none; color: oklch(0.75 0 0)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Suchen</a>
    <a href="AppResults.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none; color: oklch(0.75 0 0)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3ZM9 3v15M15 6v15"></path></svg>Karte</a>
    <a href="AppSaved.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none; color: oklch(0.7 0.14 264)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"></path></svg>Gemerkt</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; text-decoration: none; color: oklch(0.75 0 0)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Konto</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'firms' }; }
  renderVals() {
    const tab = this.state.tab;
    const tabs = [['firms', 'Firmen'], ['searches', 'Suchen']].map(([id, label]) => ({
      label, selected: tab === id ? 'true' : 'false',
      pick: () => this.setState({ tab: id }),
      style: 'height: 40px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; background: ' + (tab === id ? 'oklch(0.985 0 0)' : 'transparent') + '; color: ' + (tab === id ? 'oklch(0.19 0.012 264)' : 'oklch(0.85 0 0)')
    }));
    const food = 'M4 3v7a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 0-3 2-3 6s1 5 3 5v7';
    const bolt = 'M13 2 3 14h9l-1 8 10-12h-9l1-8Z';
    const bed = 'M2 20V6M2 16h20v4M22 16v-4a3 3 0 0 0-3-3h-8v7';
    const firms = [
      { name: 'Muster Elektro AG', cat: 'Elektriker', dist: '1.4 km', icon: bolt, tone: 'oklch(0.78 0.14 60)', tint: 'oklch(0.78 0.14 60 / 0.14)' },
      { name: 'Berggasthaus Aelggialp', cat: 'Restaurant', dist: '1.1 km', icon: food, tone: 'oklch(0.78 0.14 60)', tint: 'oklch(0.78 0.14 60 / 0.14)' },
      { name: 'Frutt Living', cat: 'Hotel', dist: '3.0 km', icon: bed, tone: 'oklch(0.8 0.1 225)', tint: 'oklch(0.8 0.1 225 / 0.14)' }
    ].map(f => Object.assign(f, { removeLabel: f.name + ' nicht mehr merken' }));
    const searches = [
      { q: 'Elektriker', where: 'Rund um 6072 Sachseln' },
      { q: 'Restaurants', where: 'Rund um Melchsee-Frutt' },
      { q: 'Treuhand', where: 'Rund um 6060 Sarnen' }
    ];
    return { tabs, firms, searches, showFirms: tab === 'firms', showSearches: tab === 'searches' };
  }
}
</script>
</body>
</html>
