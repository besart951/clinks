<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>PlanerLink – Klienten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400..700&amp;display=swap">
<style>
:root{color-scheme:dark}input::-webkit-calendar-picker-indicator{opacity:.85;cursor:pointer}
body{margin:0;background:oklch(0.145 0 0);color:oklch(0.985 0 0);font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
a{color:oklch(0.7 0.14 264)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid oklch(0.7 0.14 264);outline-offset:2px}
.qb{transition:background-color .12s,color .12s}.qb:hover{background:oklch(0.269 0 0)}
.pb{transition:background-color .12s}.pb:hover{background:oklch(0.3731 0.1751 265.638)}
.nav:hover{background:oklch(0.25 0 0)}
.hov .rv{opacity:0;transition:opacity .15s}
.hov:hover .rv,.hov:focus-within .rv{opacity:1}
.hov .more{max-height:0;opacity:0;overflow:hidden;transition:max-height .2s,opacity .15s}
.hov:hover .more,.hov:focus-within .more{max-height:120px;opacity:1}
@media (pointer:coarse){.hov .rv,.hov .more{opacity:1;max-height:none}}
.chip-w{position:relative}
.pop{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:248px;padding:12px;border-radius:12px;background:oklch(0.235 0 0);border:1px solid #ffffff1f;box-shadow:0 10px 15px -3px #00000066, 0 4px 6px -4px #00000066;text-align:left}
.chip-w:hover .pop,.chip-w:focus-within .pop{display:block}
.chip{transition:transform .1s,background-color .12s,border-color .12s}
.chip:hover{transform:translateY(-1px)}
.cell .add{opacity:0;transition:opacity .12s}
.cell:hover .add{opacity:1}
.ctl{width:100%;height:40px;padding:0 12px;border-radius:9.6px;background:oklch(0.22 0.007 255);border:1px solid oklch(0.42 0.008 255);font-size:14px}
.ctl:hover{border-color:oklch(0.6 0 0)}
.ctl:focus{outline:none;border-color:oklch(0.7 0.14 264);box-shadow:0 0 0 1px oklch(0.7 0.14 264)}
textarea.ctl{height:auto;padding:10px 12px;line-height:20px;resize:vertical}
input::placeholder,textarea::placeholder{color:oklch(0.55 0 0)}
.lb{font-size:13px;font-weight:500;color:oklch(0.72 0 0)}
.ghost{border:0;background:transparent}
.seg-b{height:30px;padding:0 12px;border:0;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.dayhead:hover{color:oklch(0.985 0 0)}
.sk{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>

<div style="min-height: 100vh; display: flex; background: oklch(0.145 0 0); color: oklch(0.985 0 0); position: relative">
  <aside style="{{asideStyle}}">
    <div style="height: 60px; padding: 0 12px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 9px; background: oklch(0.48 0.14 48 / 0.18); color: oklch(0.78 0.14 60); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9ZM6 6h12v15H6ZM9 12h6M9 16h4"></path></svg></span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span style="flex: 1; display: flex; flex-direction: column; line-height: 16px"><span style="font-size: 14px; font-weight: 600">PlanerLink</span><span style="font-size: 12px; color: oklch(0.58 0 0)">Empower</span></span>
        <button type="button" class="qb ghost" aria-label="Anwendung oder Workspace wechseln" style="width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: oklch(0.58 0 0); cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg></button></sc-if>
    </div>
    <nav aria-label="Hauptnavigation" style="padding: 8px 10px; display: flex; flex-direction: column; gap: 16px; flex: 1">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2"><div style="display: flex; flex-direction: column; gap: 2px">
        <sc-if value="{{g.show}}" hint-placeholder-val="{{true}}"><span style="padding: 0 10px 4px; font-size: 12px; color: oklch(0.58 0 0)">{{g.label}}</span></sc-if>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2"><a href="{{it.href}}" class="nav" aria-current="{{it.current}}" aria-label="{{it.label}}" title="{{it.label}}" style="{{it.style}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
          <sc-if value="{{it.show}}" hint-placeholder-val="{{true}}"><span>{{it.label}}</span></sc-if></a></sc-for>
      </div></sc-for>
    </nav>
    <div style="padding: 10px; border-top: 1px solid #ffffff14">
      <a href="WsProfil.dc.html" class="nav" aria-label="Konto von Besart Morina" style="height: 44px; padding: 0 6px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; color: oklch(0.985 0 0); text-decoration: none">
        <span aria-hidden="true" style="flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9999px; background: oklch(0.269 0 0); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">BM</span>
        <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span style="flex: 1; font-size: 13px">Besart Morina</span></sc-if></a>
    </div>
  </aside>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="height: 60px; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ffffff14">
      <button type="button" class="qb ghost" onClick="{{toggleCol}}" aria-label="{{colLabel}}" title="{{colLabel}}" style="width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: oklch(0.58 0 0); cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3ZM9 3v18"></path></svg></button>
      <h1 style="flex: 1; margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Klienten</h1>
      <button type="button" class="qb ghost" aria-label="Neu laden" title="Neu laden" style="width: 36px; height: 36px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"></path></svg></button><button type="button" class="qb ghost" aria-label="Weitere Aktionen" title="Weitere Aktionen" style="width: 36px; height: 36px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path></svg></button>
    </header>
    <div style="flex: 1; display: flex; min-height: 0">
      <main style="flex: 1; min-width: 0; padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between">
        <div style="display: flex; gap: 8px; align-items: center">
          <label style="position: relative; display: block; width: 280px"><span style="position: absolute; left: 12px; top: 11px; color: oklch(0.58 0 0)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-3.5-3.5"></path></svg></span><input class="ctl" type="search" placeholder="Klienten suchen" aria-label="Klienten suchen" onInput="{{setQ}}" style="padding-left: 36px; height: 38px; border-color: #ffffff1f; background: transparent"></label>
          <div role="group" aria-label="Darstellung" style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: oklch(0.2 0 0)"><sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" aria-label="{{m.label}}" title="{{m.label}}" style="{{m.style}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg></button></sc-for></div>
        </div>
        <button type="button" class="pb" onClick="{{newClient}}" style="height: 38px; padding: 0 16px; border-radius: 12px; border: 0; background: oklch(0.424 0.199 265.638); color: oklch(0.97 0.014 254.604); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Klient erstellen</button>
      </div><sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
      <div role="list" style="display: flex; flex-direction: column">
        <sc-for list="{{list}}" as="c" hint-placeholder-count="2">
          <div role="listitem" class="hov" style="display: grid; grid-template-columns: minmax(200px, 1.3fr) auto minmax(160px, 1fr) auto; align-items: center; gap: 16px; padding: 12px 10px; border-bottom: 1px solid #ffffff12">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><button type="button" onClick="{{c.edit}}" style="border: 0; background: transparent; padding: 0; text-align: left; font-size: 14px; font-weight: 600; cursor: pointer">{{c.name}}</button>
              <span class="more" style="font-size: 12px; color: oklch(0.58 0 0)">{{c.addr}}</span></div>
            <span style="display: inline-flex; gap: 3px"><sc-for list="{{c.days}}" as="d" hint-placeholder-count="7"><span style="{{d.style}}">{{d.w}}</span></sc-for></span>
            <div style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: oklch(0.72 0 0)"><span>{{c.einsatz}}</span><span class="more" style="font-size: 12px; color: oklch(0.58 0 0)">{{c.window}} · {{c.note}}</span></div>
            <div class="rv" style="display: flex; gap: 2px"><button type="button" class="qb ghost" onClick="{{c.edit}}" aria-label="{{c.name}} bearbeiten" title="Bearbeiten" style="width: 32px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></button><button type="button" class="qb ghost" aria-label="Weitere Aktionen" title="Weitere Aktionen" style="width: 36px; height: 36px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"></path></svg></button></div>
          </div>
        </sc-for>
      </div></sc-if><sc-if value="{{isCards}}" hint-placeholder-val="{{false}}">
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px">
        <sc-for list="{{list}}" as="c" hint-placeholder-count="2">
          <button type="button" class="hov" onClick="{{c.edit}}" style="padding: 16px; border-radius: 14px; border: 1px solid #ffffff12; background: oklch(0.195 0 0); text-align: left; display: flex; flex-direction: column; gap: 10px; cursor: pointer; color: oklch(0.985 0 0)">
            <span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 600">{{c.name}}</span><span class="rv" style="color: oklch(0.72 0 0)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></span></span>
            <span style="display: inline-flex; gap: 3px"><sc-for list="{{c.days}}" as="d" hint-placeholder-count="7"><span style="{{d.style}}">{{d.w}}</span></sc-for></span>
            <span class="more" style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: oklch(0.72 0 0)"><span>{{c.addr}}</span><span>{{c.einsatz}} · {{c.window}}</span><span style="color: oklch(0.58 0 0)">{{c.note}}</span></span>
          </button>
        </sc-for>
      </div></sc-if><sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
      <div onClick="{{closeSheet}}" style="position: fixed; inset: 0; z-index: 50; background: #00000080; display: flex; justify-content: flex-end">
        <aside role="dialog" aria-modal="true" aria-label="{{sheetTitle}}" onClick="{{stop}}" style="width: 480px; max-width: 100%; height: 100%; background: oklch(0.195 0 0); border-left: 1px solid #ffffff1f; display: flex; flex-direction: column">
          <div style="padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ffffff12"><h2 style="margin: 0; font-size: 18px; font-weight: 600">{{sheetTitle}}</h2>
            <button type="button" class="qb ghost" onClick="{{closeSheet}}" aria-label="Schliessen" style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
          <div style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 22px">
            <div style="display: flex; flex-direction: column; gap: 8px"><label class="lb" for="k-name">Name</label><input id="k-name" class="ctl" type="text" value="{{cname}}" placeholder="Vor- und Nachname"></div>
            <div style="display: flex; flex-direction: column; gap: 8px; position: relative"><label class="lb" for="k-addr">Adresse</label>
              <div style="position: relative"><span style="position: absolute; left: 12px; top: 12px; color: oklch(0.58 0 0)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0ZM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path></svg></span><input id="k-addr" class="ctl" type="text" value="{{addrQ}}" placeholder="Strasse, Nr., PLZ oder Ort eingeben" autocomplete="off" onInput="{{setAddr}}" style="padding-left: 36px"></div>
              <sc-if value="{{showSugg}}" hint-placeholder-val="{{false}}"><div role="listbox" style="position: absolute; top: 72px; left: 0; right: 0; z-index: 5; padding: 4px; border-radius: 10px; background: oklch(0.235 0 0); border: 1px solid #ffffff1f; box-shadow: 0 10px 15px -3px #00000066, 0 4px 6px -4px #00000066">
                <button type="button" role="option" class="qb ghost" onClick="{{pickSugg}}" style="width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 14px; cursor: pointer">Mariabergstrasse 5<br><span style="font-size: 12px; color: oklch(0.58 0 0)">9400 Rorschach, Schweiz</span></button></div></sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; justify-content: space-between"><span class="lb">Wochentage</span><span style="display: flex; gap: 4px"><button type="button" class="qb ghost" onClick="{{daysAll}}" style="height: 26px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: oklch(0.72 0 0); cursor: pointer">Mo–Fr</button><button type="button" class="qb ghost" onClick="{{daysEvery}}" style="height: 26px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: oklch(0.72 0 0); cursor: pointer">Täglich</button></span></div>
              <div role="group" aria-label="Wochentage" style="display: flex; gap: 6px"><sc-for list="{{edDays}}" as="d" hint-placeholder-count="7"><button type="button" onClick="{{d.toggle}}" aria-pressed="{{d.pressed}}" style="{{d.style}}">{{d.w}}</button></sc-for></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; justify-content: space-between"><span class="lb">Einsätze pro Tag</span><button type="button" class="qb ghost" onClick="{{addEinsatz}}" style="height: 28px; padding: 0 8px; border-radius: 8px; font-size: 13px; color: oklch(0.7 0.14 264); display: inline-flex; align-items: center; gap: 4px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Einsatz</button></div>
              <sc-for list="{{einsaetze}}" as="e" hint-placeholder-count="1">
                <div class="hov" style="padding: 12px; border-radius: 12px; border: 1px solid #ffffff12; background: oklch(0.17 0 0); display: flex; flex-direction: column; gap: 10px">
                  <div style="display: flex; align-items: center; gap: 8px"><span style="width: 20px; height: 20px; border-radius: 9999px; background: oklch(0.3 0 0); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">{{e.n}}</span>
                    <label class="sk" for="ein-name">Bezeichnung</label><input id="ein-name" class="ctl" type="text" value="{{e.name}}" style="flex: 1; height: 34px; border-color: transparent; background: transparent; padding: 0 6px; font-weight: 500">
                    <button type="button" class="qb ghost rv" onClick="{{e.remove}}" aria-label="Einsatz entfernen" title="Einsatz entfernen" style="width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: oklch(0.76 0.16 25); cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"></path></svg></button></div>
                  <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-size: 12px; color: oklch(0.58 0 0); width: 70px">Dauer</span><sc-for list="{{e.durPresets}}" as="p" hint-placeholder-count="4"><button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.m}} Min.</button></sc-for><label class="sk" for="{{e.durId}}">Eigene Dauer in Minuten</label><span style="position: relative; display: inline-flex"><input id="{{e.durId}}" class="ctl" type="number" inputmode="numeric" min="5" max="600" step="5" placeholder="Andere" value="{{e.durCustom}}" onInput="{{e.setDur}}" style="{{e.durCustomStyle}}"><span aria-hidden="true" style="position: absolute; right: 10px; top: 8px; font-size: 12px; color: oklch(0.58 0 0); pointer-events: none">Min.</span></span></div>
                  <div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 12px; color: oklch(0.58 0 0); width: 70px">Ankunft</span>
                    <label class="sk" for="ein-from">Früheste Ankunft</label><input id="ein-from" class="ctl" type="time" value="{{e.from}}" style="width: 110px; height: 34px">
                    <span style="color: oklch(0.58 0 0)">–</span><label class="sk" for="ein-to">Späteste Ankunft</label><input id="ein-to" class="ctl" type="time" value="{{e.to}}" style="width: 110px; height: 34px">
                    <span class="rv" title="Optional. Andere Startzeiten bleiben möglich." style="color: oklch(0.58 0 0); display: inline-flex"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 16v-4M12 8h.01"></path></svg></span></div>
                </div>
              </sc-for>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px"><label class="lb" for="k-note">Notizen</label><textarea id="k-note" class="ctl" rows="3" placeholder="Hinweise für Mitarbeitende">Einige Notizen.</textarea></div>
          </div>
          <div style="padding: 14px 20px; border-top: 1px solid #ffffff12; display: flex; justify-content: flex-end; gap: 8px"><button type="button" class="qb" onClick="{{closeSheet}}" style="height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid #ffffff1f; background: transparent; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: oklch(0.985 0 0)">Abbrechen</button><button type="button" class="pb" onClick="{{saveClient}}" style="height: 38px; padding: 0 16px; border-radius: 12px; border: 0; background: oklch(0.424 0.199 265.638); color: oklch(0.97 0.014 254.604); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer">Speichern</button></div>
        </aside>
      </div></sc-if></main>
      
    </div>
  </div>
