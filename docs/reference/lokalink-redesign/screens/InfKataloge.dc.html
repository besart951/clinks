<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>InfraLink – Kataloge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400..700&amp;display=swap">
<style>
:root{color-scheme:dark}input::-webkit-calendar-picker-indicator{opacity:.85;cursor:pointer}
body{margin:0;background:oklch(0.145 0 0);color:oklch(0.985 0 0);font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
*{box-sizing:border-box}
a{color:oklch(0.7 0.14 264)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid oklch(0.7 0.14 264);outline-offset:2px}
.qb{transition:background-color .12s,color .12s}.qb:hover{background:oklch(0.269 0 0)}
.pb{transition:background-color .12s}.pb:hover{background:oklch(0.3731 0.1751 265.638)}
.nav:hover{background:oklch(0.25 0 0)}
.hov .rv{opacity:0;transition:opacity .15s}
.hov:hover .rv,.hov:focus-within .rv{opacity:1}
.hov .more{max-height:0;opacity:0;overflow:hidden;transition:max-height .2s,opacity .15s}
.hov:hover .more,.hov:focus-within .more{max-height:120px;opacity:1}
@media (pointer:coarse){.hov .rv,.hov .more{opacity:1;max-height:none}}
.chip-w{position:relative}
.pop{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:248px;padding:12px;border-radius:12px;background:oklch(0.235 0 0);border:1px solid #ffffff1f;box-shadow:0 10px 15px -3px #00000066, 0 4px 6px -4px #00000066;text-align:left}
.chip-w:hover .pop,.chip-w:focus-within .pop{display:block}
.chip{transition:transform .1s,background-color .12s,border-color .12s}
.chip:hover{transform:translateY(-1px)}
.cell .add{opacity:0;transition:opacity .12s}
.cell:hover .add{opacity:1}
.ctl{width:100%;height:40px;padding:0 12px;border-radius:9.6px;background:oklch(0.22 0.007 255);border:1px solid oklch(0.42 0.008 255);font-size:14px}
.ctl:hover{border-color:oklch(0.6 0 0)}
.ctl:focus{outline:none;border-color:oklch(0.7 0.14 264);box-shadow:0 0 0 1px oklch(0.7 0.14 264)}
textarea.ctl{height:auto;padding:10px 12px;line-height:20px;resize:vertical}
input::placeholder,textarea::placeholder{color:oklch(0.55 0 0)}
.lb{font-size:13px;font-weight:500;color:oklch(0.72 0 0)}
.ghost{border:0;background:transparent}
.seg-b{height:30px;padding:0 12px;border:0;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.dayhead:hover{color:oklch(0.985 0 0)}
.sk{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<style>
.mono{font-family:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.row:hover{background:#ffffff08}
.node{transition:background-color .1s}.node:hover{background:#ffffff0d}
.node .add{opacity:0;transition:opacity .12s}.node:hover .add,.node:focus-within .add{opacity:1}
.tab{height:40px;padding:0 2px;border:0;background:transparent;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:oklch(0.985 0 0)}
.ochip{transition:border-color .12s,background-color .12s}.ochip:hover{border-color:oklch(0.6 0 0)}
.tip{position:relative;display:inline-flex}.tip .tipbox{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);z-index:40;width:240px;padding:8px 10px;border-radius:8px;background:oklch(0.985 0 0);color:oklch(0.2 0.016 255);font-size:12px;line-height:17px;font-weight:400;white-space:normal}
.tip:hover .tipbox,.tip:focus-within .tipbox{display:block}
@keyframes pulse{0%{box-shadow:0 0 0 0 oklch(0.723 0.219 149.579 / 0.6)}70%{box-shadow:0 0 0 6px oklch(0.723 0.219 149.579 / 0)}100%{box-shadow:0 0 0 0 oklch(0.723 0.219 149.579 / 0)}}
.live{animation:pulse 2s infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}.typing span{animation:blink 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
.avs .av{margin-left:-8px}.avs .av:first-child{margin-left:0}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-button{display:none;width:0;height:0}::-webkit-scrollbar-thumb{background:#ffffff26;border-radius:9999px}::-webkit-scrollbar-track{background:transparent}
</style>
</helmet>

<div style="min-height: 100vh; display: flex; background: oklch(0.145 0 0); color: oklch(0.985 0 0); position: relative">
  <aside style="{{asideStyle}}">
    <div style="height: 60px; padding: 0 12px; display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 9px; background: oklch(0.55 0.2 25 / 0.16); color: oklch(0.75 0.17 25); display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6v5H9ZM3 16h6v5H3ZM15 16h6v5h-6ZM12 8v4M6 16v-4h12v4"></path></svg></span>
      <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span style="flex: 1; display: flex; flex-direction: column; line-height: 16px"><span style="font-size: 14px; font-weight: 600">InfraLink</span><span style="font-size: 12px; color: oklch(0.58 0 0)">CLinks</span></span>
        <button type="button" class="qb ghost" aria-label="Anwendung wechseln" style="width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: oklch(0.58 0 0); cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg></button></sc-if>
    </div>
    <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><div style="padding: 0 10px 6px">
      <button type="button" class="qb" aria-label="Mandant wechseln, aktuell Besi-Test" style="width: 100%; height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid #ffffff1a; background: transparent; display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 9999px; background: oklch(0.723 0.219 149.579)"></span><span style="flex: 1; text-align: left">Besi-Test</span><span style="color: oklch(0.58 0 0)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></span></button></div></sc-if>
    <nav aria-label="Hauptnavigation" style="padding: 8px 10px; display: flex; flex-direction: column; gap: 14px; flex: 1">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5"><div style="display: flex; flex-direction: column; gap: 2px">
        <sc-if value="{{g.show}}" hint-placeholder-val="{{true}}"><span style="padding: 0 10px 4px; font-size: 12px; color: oklch(0.58 0 0)">{{g.label}}</span></sc-if>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2"><a href="{{it.href}}" class="nav" aria-current="{{it.current}}" aria-label="{{it.label}}" title="{{it.label}}" style="{{it.style}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
          <sc-if value="{{it.show}}" hint-placeholder-val="{{true}}"><span>{{it.label}}</span></sc-if></a></sc-for>
      </div></sc-for>
    </nav>
    <div style="padding: 10px; border-top: 1px solid #ffffff14">
      <a href="WsProfil.dc.html" class="nav" aria-label="Konto von Besart Morina" style="height: 44px; padding: 0 6px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; color: oklch(0.985 0 0); text-decoration: none">
        <span aria-hidden="true" style="flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9999px; background: oklch(0.269 0 0); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">BM</span>
        <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}"><span style="flex: 1; font-size: 13px">Besart Morina</span></sc-if></a>
    </div>
  </aside>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <header style="height: 60px; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ffffff14">
      <button type="button" class="qb ghost" onClick="{{toggleCol}}" aria-label="{{colLabel}}" title="{{colLabel}}" style="width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: oklch(0.58 0 0); cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3ZM9 3v18"></path></svg></button>
      <h1 style="flex: 1; margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">Kataloge</h1>
      
      <button type="button" class="qb ghost" aria-label="Benachrichtigungen, 1 neu" title="Benachrichtigungen" style="position: relative; width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span aria-hidden="true" style="position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 9999px; background: oklch(0.7 0.14 264)"></span></button>
    </header>
    <div style="flex: 1; display: flex; min-height: 0">
      <main style="flex: 1; min-width: 0; padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 16px"><div role="tablist" aria-label="Kataloge" style="display: flex; gap: 22px; border-bottom: 1px solid #ffffff14">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button type="button" role="tab" aria-selected="{{t.pressed}}" class="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}} <span style="font-size: 12px; font-weight: 400; color: oklch(0.58 0 0)">{{t.n}}</span></button></sc-for></div><div style="display: flex; align-items: center; gap: 10px">
        <label style="position: relative; width: 300px"><span style="position: absolute; left: 12px; top: 11px; color: oklch(0.58 0 0)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-3.5-3.5"></path></svg></span><input class="ctl" type="search" value="{{q}}" onInput="{{setQ}}" placeholder="{{searchPh}}" aria-label="{{searchPh}}" style="padding-left: 36px"></label>
        <span style="font-size: 13px; color: oklch(0.58 0 0)">{{hint}}</span><span style="flex: 1"></span>
        <button type="button" class="qb ghost" aria-label="Katalogverlauf" title="Katalogverlauf" style="width: 36px; height: 36px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"></path></svg></button>
        <button type="button" class="pb" onClick="{{startAdd}}" style="height: 38px; padding: 0 16px; border-radius: 12px; border: 0; background: oklch(0.424 0.199 265.638); color: oklch(0.97 0.014 254.604); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{addLabel}}</button></div><section style="border-radius: 14px; background: oklch(0.195 0 0); border: 1px solid #ffffff14; overflow: hidden; padding-top: 12px">
        <sc-if value="{{adding}}" hint-placeholder-val="{{false}}"><div style="margin: 0 12px 12px; padding: 14px; border-radius: 12px; background: oklch(0.17 0 0); border: 1px solid oklch(0.7 0.14 264 / 0.4); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start">
          <sc-for list="{{form}}" as="f" hint-placeholder-count="3"><div style="display: flex; flex-direction: column; gap: 6px">
            <label class="lb" for="{{f.id}}">{{f.label}}</label>
            <sc-if value="{{f.isText}}" hint-placeholder-val="{{true}}"><input id="{{f.id}}" class="ctl" type="text" value="{{f.val}}" onInput="{{f.on}}" placeholder="{{f.ph}}" style="width: 240px"></sc-if>
            <sc-if value="{{f.isMono}}" hint-placeholder-val="{{false}}"><input id="{{f.id}}" class="ctl mono" type="text" value="{{f.val}}" onInput="{{f.on}}" placeholder="{{f.ph}}" style="width: 120px; text-transform: uppercase"></sc-if>
            <sc-if value="{{f.isRange}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 8px"><input id="{{f.id}}" class="ctl mono" type="text" value="{{f.from}}" onInput="{{f.onFrom}}" aria-label="Von" style="width: 90px"><span style="color: oklch(0.58 0 0)">bis</span><input class="ctl mono" type="text" value="{{f.to}}" onInput="{{f.onTo}}" aria-label="Bis" style="width: 90px"></span></sc-if>
            <sc-if value="{{f.isChips}}" hint-placeholder-val="{{false}}"><span role="group" aria-label="{{f.label}}" style="display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px"><sc-for list="{{f.chips}}" as="c" hint-placeholder-count="4"><button type="button" class="ochip" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for></span></sc-if>
          </div></sc-for>
        </div>
        <sc-if value="{{isSys}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: oklch(0.58 0 0)">{{freeHint}}</span></sc-if>
        <sc-if value="{{hasErr}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 0; font-size: 12px; color: oklch(0.76 0.16 25)">{{err}}</p></sc-if>
        <div style="display: flex; justify-content: flex-end; gap: 8px"><button type="button" class="qb" onClick="{{cancelAdd}}" style="height: 38px; padding: 0 14px; border-radius: 12px; border: 1px solid #ffffff1f; background: transparent; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: oklch(0.985 0 0)">Abbrechen</button><button type="button" onClick="{{create}}" style="{{createStyle}}">Hinzufügen</button></div></div></sc-if>
        <div role="row" style="{{tmpl}}; height: 36px; font-size: 12px; color: oklch(0.58 0 0)"><sc-for list="{{headCols}}" as="h" hint-placeholder-count="4"><span>{{h.l}}</span></sc-for><span></span></div>
        <sc-if value="{{isSys}}" hint-placeholder-val="{{false}}"><div style="{{tmpl}}; height: 18px; font-size: 10px; color: oklch(0.58 0 0)"><span></span><span style="position: relative; height: 14px"><sc-for list="{{scale}}" as="s" hint-placeholder-count="5"><span class="mono" style="{{s.style}}">{{s.n}}</span></sc-for></span><span></span><span></span></div></sc-if>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div role="row" class="hov row" style="{{r.style}}">
          <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4"><div style="min-width: 0; font-size: 14px">
            <sc-if value="{{c.isText}}" hint-placeholder-val="{{true}}"><span style="font-weight: 500">{{c.text}}</span></sc-if>
            <sc-if value="{{c.isMono}}" hint-placeholder-val="{{false}}"><span class="mono" style="font-weight: 600; color: oklch(0.7 0.14 264)">{{c.text}}</span></sc-if>
            <sc-if value="{{c.isMuted}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: oklch(0.72 0 0)">{{c.text}}</span></sc-if>
            <sc-if value="{{c.isChips}}" hint-placeholder-val="{{false}}"><span style="display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{c.chips}}" as="x" hint-placeholder-count="2"><span style="height: 22px; padding: 0 8px; border-radius: 9999px; background: #ffffff0f; font-size: 12px; display: inline-flex; align-items: center">{{x.x}}</span></sc-for><sc-if value="{{c.none}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; color: oklch(0.58 0 0)">–</span></sc-if></span></sc-if>
            <sc-if value="{{c.isRange}}" hint-placeholder-val="{{false}}"><span style="display: flex; flex-direction: column; gap: 6px"><span style="display: flex; gap: 10px; align-items: baseline"><span class="mono" style="font-weight: 600">{{c.text}}</span><span style="font-size: 12px; color: oklch(0.58 0 0)">{{c.size}}</span><sc-if value="{{c.ov}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: oklch(0.76 0.16 25)">überschneidet sich</span></sc-if></span><span aria-hidden="true" style="position: relative; height: 6px; border-radius: 9999px; background: #ffffff10"><span style="{{c.barStyle}}"></span></span></span></sc-if>
          </div></sc-for>
          <span class="rv" style="display: flex; justify-content: flex-end"><button type="button" class="qb ghost" aria-label="Bearbeiten" title="Bearbeiten" style="width: 36px; height: 36px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></button><button type="button" class="qb ghost" onClick="{{r.del}}" aria-label="Löschen" title="Löschen" style="width: 36px; height: 36px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; color: oklch(0.72 0 0); cursor: pointer; "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"></path></svg></button></span>
        </div></sc-for>
        <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 28px 20px; border-top: 1px solid #ffffff0d; font-size: 13px; color: oklch(0.58 0 0)">Keine Einträge.</p></sc-if>
        <div style="height: 8px"></div>
      </section></main>
    </div>
  </div>
  
  <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; padding: 10px 8px 10px 16px; border-radius: 12px; background: oklch(0.985 0 0); color: oklch(0.2 0.016 255); display: flex; align-items: center; gap: 12px; font-size: 14px; box-shadow: 0 10px 15px -3px #00000066, 0 4px 6px -4px #00000066">{{toastText}}
      <button type="button" class="ghost" onClick="{{hideToast}}" aria-label="Meldung schliessen" style="width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = Object.assign({ col: false, toast: '' }, { tab: 'at', q: '', adding: false, nf: {}, extra: {}, gone: {} }); }

  renderVals() {

    const rowStyle = 'display: grid; grid-template-columns: ' + tmpl + '; gap: 0 14px; align-items: center; padding: 0 20px; min-height: 50px; border-top: 1px solid #ffffff0d';

    const nf = st.nf || {};
    const freeRange = (() => { const rs = rowsAll.slice().sort((a, b) => a.from - b.from); let f = 1; for (const r of rs) { if (r.from > f) break; f = Math.max(f, r.to + 1); } return f; })();
    const nFrom = nf.from === undefined || nf.from === '' ? freeRange : parseInt(nf.from, 10); const nTo = nf.to === undefined || nf.to === '' ? freeRange + 99 : parseInt(nf.to, 10);
    let err = '';

      const first = T.form[0][0];
      if (tabKey === 'sys') { const ov = rowsAll.find(x => nFrom <= x.to && nTo >= x.from); err = nTo < nFrom ? '«Bis» muss grösser als «Von» sein.' : ov ? 'Überschneidet sich mit ' + ov.name + ' (' + pad(ov.from, 4) + '–' + pad(ov.to, 4) + ').' : ''; }
      if ((tabKey === 'at' || tabKey === 'ap') && nf.k && rowsAll.some(x => x.k === nf.k)) err = 'Kurzname ' + nf.k + ' gibt es schon.';
      if (!err && !nf[first]) err = '';
    }
    const canAdd = st.adding && !err && !!nf[T.form[0][0]];
    const setNf = (k, up) => (e) => this.setState({ nf: Object.assign({}, nf, { [k]: up ? e.target.value.toUpperCase() : e.target.value }) });
    const form = T.form.map(f => ({ k: f[0], label: f[1], ph: f[3], id: 'nf-' + f[0], isText: f[2] === 'text', isMono: f[2] === 'mono', isRange: f[2] === 'range', isChips: f[2] === 'chips',
      val: nf[f[0]] || '', on: setNf(f[0], f[2] === 'mono'), from: pad(nFrom, 4), to: pad(nTo, 4), onFrom: setNf('from'), onTo: setNf('to'),
      chips: APPARATE.map(a => { const sel = (nf.ap || []).includes(a.k); return { label: a.k + ' · ' + a.n, pressed: sel ? 'true' : 'false', pick: () => this.setState({ nf: Object.assign({}, nf, { ap: sel ? nf.ap.filter(x => x !== a.k) : (nf.ap || []).concat(a.k) }) }),

    const create = () => { if (!canAdd) return; let r = Object.assign({ id: 'x' + Date.now() }, nf);
      if (tabKey === 'sys') r = { id: r.id, name: nf.name, from: nFrom, to: nTo, used: '–' };
      if (tabKey === 'at') r = { id: r.id, k: nf.k, n: nf.n || '', ap: (nf.ap || []).map(k => k + ' · ' + APPARATE.find(x => x.k === k).n), used: '–' };
      if (tabKey === 'ap') r = { id: r.id, k: nf.k, n: nf.n || '', at: [], od: '–' };
      if (tabKey === 'zt') r = { id: r.id, n: nf.n, st: (nf.st || '').split(',').map(s => s.trim()).filter(Boolean).map((s, i) => i + ' · ' + s), used: '–' };
      if (tabKey === 'ei' || tabKey === 'mk') r.used = '–';
      this.setState({ extra: Object.assign({}, extra, { [tabKey]: (extra[tabKey] || []).concat(r) }), adding: false, nf: {}, toast: T.one + ' hinzugefügt.' }); };
    const V = {
      tabs: ORDER.map(k => ({ label: T0[k].label, n: String(T0[k].rows.length + (extra[k] || []).length - Object.keys(gone).filter(g => g.startsWith(k + ':')).length), pressed: k === tabKey ? 'true' : 'false',
        style: 'color: ' + (k === tabKey ? 'oklch(0.985 0 0)' : 'oklch(0.66 0 0)') + '; border-bottom-color: ' + (k === tabKey ? 'oklch(0.7 0.14 264)' : 'transparent') + '; font-weight: ' + (k === tabKey ? 600 : 400),
        pick: () => this.setState({ tab: k, q: '', adding: false, nf: {} }) })),
      hint: T.hint, one: T.one, addLabel: T.one, q: st.q, setQ: (e) => this.setState({ q: e.target.value }), searchPh: T.label + ' durchsuchen',
      headCols: T.cols.map(c => ({ l: c[1] })), tmpl: 'display: grid; grid-template-columns: ' + tmpl + '; gap: 0 14px; align-items: center; padding: 0 20px',
      rows, empty: rows.length === 0, count: rows.length + ' Einträge', isSys: tabKey === 'sys',
      adding: !!st.adding, startAdd: () => this.setState({ adding: true, nf: tabKey === 'sys' ? {} : {} }), cancelAdd: () => this.setState({ adding: false, nf: {} }),
      form, err, hasErr: !!err, create, freeHint: 'Nächster freier Bereich ab ' + pad(freeRange, 4),
      createStyle: 'height: 36px; padding: 0 14px; border-radius: 10px; border: 0; font-size: 14px; font-weight: 500; cursor: ' + (canAdd ? 'pointer' : 'not-allowed') + '; background: ' + (canAdd ? 'oklch(0.424 0.199 265.638); color: oklch(0.97 0.014 254.604)' : 'oklch(0.26 0 0); color: oklch(0.6 0 0)'),
      scale: [0, 100, 200, 300, 400].map(n => ({ n: pad(n, 4), style: 'position: absolute; left: ' + (n / maxTo * 100) + '%; transform: translateX(' + (n === 0 ? '0' : n === maxTo ? '-100%' : '-50%') + ')' })),
    };

    return Object.assign({}, SH, V);
  }
