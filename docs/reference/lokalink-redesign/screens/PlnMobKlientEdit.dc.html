      save: () => this.setState({ toast: 'Klient gespeichert.' })
    };

    return Object.assign({ stop: (e) => e.stopPropagation(), toastOn: !!st.toast, toastText: st.toast || '', hideToast: () => this.setState({ toast: '' }) }, V);
  }
}
</script>
</body>
