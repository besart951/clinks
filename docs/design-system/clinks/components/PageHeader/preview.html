<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>PageHeader — preview</title>
</head>
<body>
<div style="padding:var(--desktop-page);display:grid;gap:var(--page-gap)">
  <header class="cl-page-header">
    <div class="cl-back">
      <button class="cl-btn cl-btn--ghost cl-btn--icon" type="button" aria-label="Zurück"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <div class="cl-heading"><h1 class="cl-page-title">Firma Muster AG</h1><p class="cl-page-desc">Änderungen gelten ab dem nächsten Abrechnungszeitraum.</p></div>
    </div>
    <div class="cl-actions">
      <button class="cl-btn cl-btn--ghost cl-btn--icon" type="button" aria-label="Aktualisieren"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
      <button class="cl-btn" type="button"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Mitglied einladen</button>
    </div>
  </header>
  <header class="cl-section-header">
    <div class="cl-heading"><h2 class="cl-section-title">Mitglieder</h2></div>
    <div class="cl-actions"><button class="cl-btn cl-btn--outline cl-btn--sm" type="button">Exportieren</button></div>
  </header>
</div>
</body>
</html>
