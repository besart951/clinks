<!doctype html>

.pi { display:grid; gap:6px; padding:var(--desktop-page); }
.pi-row { display:grid; grid-template-columns:24px minmax(0,1fr) auto 9.5rem; align-items:center; gap:12px; min-height:40px; padding:0 8px; border-bottom:1px solid var(--border); }
.pi-tile { display:inline-grid; place-items:center; width:24px; height:24px; border-radius:6px; }
.pi-tile .cl-icon { width:14px; height:14px; }
.pi-tile--mark img { width:20px; height:20px; }
.pi-name { font-weight:500; }
.pi-btn { display:inline-flex; align-items:center; height:32px; padding:0 12px; border-radius:var(--radius-md); font-weight:500; font-size:14px; }
.pi-token { font-family:var(--font-mono, monospace); font-size:12px; color:var(--muted-foreground); }
</style>
