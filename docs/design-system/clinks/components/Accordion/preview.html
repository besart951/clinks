<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Accordion — preview</title>
</head>
<body>
<div style="padding:var(--desktop-page);max-width:640px">
  <div class="cl-accordion">
    <div class="cl-accordion-item" data-open>
      <button class="cl-accordion-trigger" type="button" aria-expanded="true">Welche Daten sieht der Support?<svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
      <div class="cl-accordion-content">Nur die Daten des Tickets, für die Dauer des Supportzugriffs. Der Zugriff endet automatisch.</div>
    </div>
    <div class="cl-accordion-item"><button class="cl-accordion-trigger" type="button" aria-expanded="false">Kann ich mehrere Produkte nutzen?<svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
    <div class="cl-accordion-item"><button class="cl-accordion-trigger" type="button" aria-expanded="false">Wie kündige ich ein Paket?<svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
  </div>
</div>
</body>
</html>
