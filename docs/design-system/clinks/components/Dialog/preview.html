<!-- @dsCard group="Overlays" height=300 subtitle="ConfirmDialog with a destructive action" -->
<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Dialog — preview</title>
</head>
<body>
<div style="position:relative;height:300px">
  <div class="cl-overlay">
    <div class="cl-dialog" role="alertdialog" aria-labelledby="d-t" aria-describedby="d-d">
      <div class="cl-dialog-header">
        <h2 class="cl-dialog-title" id="d-t">Mitglied entfernen?</h2>
        <p class="cl-dialog-desc" id="d-d">Luca Rossi verliert sofort den Zugang zu Firma Muster AG. Geplante Termine bleiben erhalten.</p>
      </div>
      <div class="cl-dialog-footer">
        <button class="cl-btn cl-btn--outline" type="button">Abbrechen</button>
        <button class="cl-btn cl-btn--destructive" type="button">Entfernen</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
