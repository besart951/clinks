<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Alert — preview</title>
</head>
<body>
<div style="padding:var(--desktop-page);display:grid;gap:var(--form-gap);max-width:640px">
  <div class="cl-alert" role="alert"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><div class="cl-alert-title">Testversand ausstehend</div><div class="cl-alert-desc">Senden Sie eine Testnachricht, bevor Sie das Profil aktivieren.</div></div>
  <div class="cl-alert cl-alert--destructive" role="alert"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><div class="cl-alert-title">Verbindung fehlgeschlagen</div><div class="cl-alert-desc">Der Server hat die Anmeldung abgelehnt.</div></div>
  <div class="cl-alert cl-alert--support" role="alert"><div class="cl-alert-title">Supportzugriff aktiv</div><div class="cl-alert-desc"><span>Ticket SUP-2041; läuft in 14 Minuten ab.</span><button class="cl-btn cl-btn--outline cl-btn--sm" type="button">Supportzugriff beenden</button></div></div>
</div>
</body>
</html>
