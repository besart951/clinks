<!-- @dsCard group="Actions" height=212 subtitle="Variants, sizes and IconButton" -->
<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
</head>
<body>
<div style="padding:var(--desktop-page);display:grid;gap:var(--form-gap);">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--control-gap);">
    <button class="cl-btn" type="button">Speichern</button>
    <button class="cl-btn cl-btn--outline" type="button">Abbrechen</button>
    <button class="cl-btn cl-btn--secondary" type="button">Vorschau</button>
    <button class="cl-btn cl-btn--ghost" type="button">Details</button>
    <button class="cl-btn cl-btn--destructive" type="button"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Löschen</button>
    <button class="cl-btn cl-btn--link" type="button">Passwort ändern</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--control-gap);">
    <button class="cl-btn cl-btn--lg" type="button"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Mitglied einladen</button>
    <button class="cl-btn cl-btn--sm cl-btn--outline" type="button">Supportzugriff beenden</button>
    <button class="cl-btn cl-btn--xs cl-btn--outline" type="button">Zurücksetzen</button>
    <button class="cl-btn" type="button" disabled>Speichern</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--control-gap);">
    <button class="cl-btn cl-btn--ghost cl-btn--icon" type="button" aria-label="Bearbeiten"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button>
    <button class="cl-btn cl-btn--ghost cl-btn--icon" type="button" aria-label="Aktualisieren"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button class="cl-btn cl-btn--outline cl-btn--icon" type="button" aria-label="Weitere Aktionen"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
    <button class="cl-btn cl-btn--ghost cl-btn--icon-sm" type="button" aria-label="Schliessen"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>
</body>
</html>
