<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Badge — preview</title>
</head>
<body>
<div style="padding:var(--desktop-page);display:grid;gap:var(--form-gap);">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--control-gap);">
    <span class="cl-badge cl-badge--neutral">Archiviert</span>
    <span class="cl-badge cl-badge--info">Eingeladen</span>
    <span class="cl-badge cl-badge--success">Bezahlt</span>
    <span class="cl-badge cl-badge--warning">Läuft bald ab</span>
    <span class="cl-badge cl-badge--danger">Fehlgeschlagen</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:var(--control-gap);">
    <span class="cl-badge">Neu</span>
    <span class="cl-badge cl-badge--secondary">Entwurf</span>
    <span class="cl-badge cl-badge--outline">Pilot</span>
  </div>
</div>
</body>
</html>
