<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Checkbox — preview</title>
</head>
<body>
<div style="padding:var(--desktop-page);display:grid;gap:12px">
  <label class="cl-check-row cl-label"><span class="cl-checkbox" role="checkbox" aria-checked="true" tabindex="0"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Rechnung per E-Mail</label>
  <label class="cl-check-row cl-label"><span class="cl-checkbox" role="checkbox" aria-checked="false" tabindex="0"></span>Erinnerung senden</label>
  <label class="cl-check-row cl-label"><span class="cl-checkbox" role="checkbox" aria-checked="mixed" tabindex="0"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>Alle Standorte</label>
  <label class="cl-check-row cl-label"><span class="cl-checkbox" role="checkbox" aria-checked="false" aria-invalid="true" tabindex="0"></span>Bedingungen akzeptiert</label>
</div>
</body>
</html>
