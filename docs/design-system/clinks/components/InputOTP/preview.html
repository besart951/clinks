<!-- @dsCard group="Forms" height=144 subtitle="Default 28px slots; sign-in variant at 44px" -->
<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>InputOTP — preview</title>
</head>
<body>
<div style="padding:var(--desktop-page);display:grid;gap:var(--form-gap);">
  <div class="cl-otp" role="group" aria-label="Bestätigungscode">
    <div class="cl-otp-group"><span class="cl-otp-slot">4</span><span class="cl-otp-slot">8</span><span class="cl-otp-slot" data-active="true"><span class="cl-otp-caret"></span></span></div>
    <span style="display:flex"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>
    <div class="cl-otp-group"><span class="cl-otp-slot"></span><span class="cl-otp-slot"></span><span class="cl-otp-slot"></span></div>
  </div>
  <div class="cl-otp" style="max-width:384px">
    <div class="cl-otp-group" style="flex:1"><span class="cl-otp-slot cl-otp-slot--login">4</span><span class="cl-otp-slot cl-otp-slot--login">8</span><span class="cl-otp-slot cl-otp-slot--login">1</span></div>
    <span style="display:flex"><svg class="cl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>
    <div class="cl-otp-group" style="flex:1"><span class="cl-otp-slot cl-otp-slot--login">5</span><span class="cl-otp-slot cl-otp-slot--login"></span><span class="cl-otp-slot cl-otp-slot--login"></span></div>
  </div>
</div>
</body>
</html>
