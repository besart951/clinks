<!-- @dsCard group="Layout" height=260 subtitle="Werte sichtbar, Bearbeiten erst bei Hover" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>SettingsList — preview</title>
<style>.stage{padding:var(--space-6);max-width:620px}</style></head>
<body>
<div class="stage"><div class="ui-list">
<div class="ui-list__row ui-reveal-scope"><div class="ui-list__text"><div class="ui-list__label">Projektname</div><div class="ui-list__hint">Wird in Einladungen angezeigt</div></div><span class="ui-list__value">Areal Nord</span><button class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm ui-btn--muted ui-reveal" aria-label="Projektname bearbeiten"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div>
<div class="ui-list__row ui-reveal-scope is-revealed"><div class="ui-list__text"><div class="ui-list__label">Standard-Vorlage</div><div class="ui-list__hint">Neue Feldgeräte übernehmen diese Version</div></div><span class="ui-list__value">BACnet v3.2</span><button class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm ui-btn--muted ui-reveal" aria-label="Standard-Vorlage bearbeiten"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button></div>
<div class="ui-list__row ui-reveal-scope"><div class="ui-list__text"><div class="ui-list__label">E-Mail bei Änderungen</div><div class="ui-list__hint">Benachrichtigt alle Projektmitglieder</div></div><button class="ui-switch" role="switch" aria-checked="true" aria-label="E-Mail bei Änderungen"></button></div>
</div></div>
</body>
</html>
