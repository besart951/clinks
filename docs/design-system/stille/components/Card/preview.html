<!-- @dsCard group="Layout" height=236 subtitle="Aktionen erscheinen bei Hover / Fokus" -->
<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Card — preview</title>
<style>.stage{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);padding:var(--space-6)}.tag{font-size:12px;color:var(--muted-foreground);margin:0 0 var(--space-2)}</style></head>
<body>
<div class="stage">
<div><p class="tag">Ruhezustand – zum Testen hovern</p>
<article class="ui-card ui-card--interactive ui-reveal-scope">
<header class="ui-card__header"><div class="ui-card__heading"><h3 class="ui-card__title">Gebäude Nord</h3><p class="ui-card__desc">4 Schaltschränke · 12 SPS</p></div>
<div class="ui-card__actions ui-reveal"><button class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm ui-btn--muted" aria-label="Bearbeiten"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm ui-btn--muted" aria-label="Mehr"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div></header>
<div class="ui-card__footer" style="padding-top:var(--space-4)"><span class="ui-badge ui-badge--outline"><span class="ui-dot ui-dot--success"></span>Aktiv</span><span>vor 2 Std.</span></div>
</article></div>
<div><p class="tag">Hover-Zustand</p>
<article class="ui-card ui-card--interactive ui-reveal-scope is-revealed" style="box-shadow:var(--shadow-sm)">
<header class="ui-card__header"><div class="ui-card__heading"><h3 class="ui-card__title">Gebäude Süd</h3><p class="ui-card__desc">2 Schaltschränke · 5 SPS</p></div>
<div class="ui-card__actions ui-reveal"><button class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm ui-btn--muted" aria-label="Bearbeiten"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm ui-btn--muted" aria-label="Mehr"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div></header>
<div class="ui-card__footer" style="padding-top:var(--space-4)"><span class="ui-badge ui-badge--outline"><span class="ui-dot ui-dot--warning"></span>Entwurf</span><span>gestern</span></div>
</article></div>
</div>
</body>
</html>
