<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Switch — preview</title>
<style>.stage{display:flex;gap:var(--space-6);align-items:center;padding:var(--space-6)}label{display:flex;gap:var(--space-2);align-items:center;font-size:14px}</style></head>
<body>
<div class="stage">
<label><button class="ui-switch" role="switch" aria-checked="true" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')!=='true')"></button>Benachrichtigungen</label>
<label><button class="ui-switch" role="switch" aria-checked="false" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked')!=='true')"></button>Öffentlich sichtbar</label>
</div>
</body>
</html>
