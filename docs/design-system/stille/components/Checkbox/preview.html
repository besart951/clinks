<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Checkbox — preview</title>
<style>.stage{display:flex;gap:var(--space-6);padding:var(--space-6)}</style></head>

<div class="stage">
<span class="ui-check" role="checkbox" tabindex="0" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')"><span class="ui-check__box"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Kopie der Vorlage</span>
