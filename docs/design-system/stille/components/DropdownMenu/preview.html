<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>DropdownMenu — preview</title>

<div class="stage">
<button class="ui-btn ui-btn--ghost ui-btn--icon ui-btn--sm" aria-label="Mehr" aria-expanded="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
