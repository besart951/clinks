function startLive() {
  var settled = false, fallback = setTimeout(function () { if (!settled) startDemo('no viewer'); }, 10500);

    settled = true; clearTimeout(fallback);
    var db = r[0], user = r[1];
    if (!db) return startDemo('signed out');
    People.user = user;
    return Promise.resolve(user ? user.id() : null).then(function (id) {
      People.me = id || 'anon';
      if (user && user.me) Promise.resolve(user.me()).then(function (p) { if (p && p.name) { People.names[People.me] = p.name; Store.emit(); } }).catch(function () {});
      if (user && user.can) Promise.resolve(user.can('data.write')).then(function (c) { if (c === false) { Store.canWrite = false; Store.note = 'Nur Lesen – du hast keine Schreibrechte.'; Store.emit(); } }).catch(function () {});

      var A = new DbAdapter(db, id); Store.A = A; Store.mode = 'loading'; Store.emit();

    });
  }).catch(function () { settled = true; clearTimeout(fallback); startDemo('error'); });

(function () {

  var tb = $('#theme');

  var col = $('.js-collapse'), tip = null, tipFor = null;
  function hideTip() { if (tip) { tip.remove(); tip = null; } tipFor = null; }

    app.classList.toggle('is-collapsed', c); hideTip();

  }

    col.onclick = function () { setCol(!app.classList.contains('is-collapsed'), true); };
    try { setCol(localStorage.getItem('stille-an-collapsed') === '1'); } catch (x) { setCol(false); }

      var el = e.target.closest('.ui-nav-item, #theme, .js-collapse'); if (el && el === tipFor) return; hideTip();

      var r = el.getBoundingClientRect(); tip.style.left = (r.right + 8) + 'px'; tip.style.top = (r.top + r.height / 2 - tip.offsetHeight / 2) + 'px';
