<!-- @dsCard height=288 -->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stille</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--foreground); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .deep { fill:var(--foreground); }
  .mid  { fill:var(--input); }
  .tint { fill:var(--border); }
  .blk  { rx:var(--radius-lg); }
  .dot  { fill:var(--input); }
  .dot.on { fill:var(--foreground); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:120px; line-height:.9; font-weight:600; letter-spacing:-.04em; color:var(--foreground); }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--muted-foreground); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      foreground 176×272 bled off the top (the ink the system is known by) · input 96×216 bleeding off the right · border 160×144 as the quiet tint — ≈30% of 960×288
  arrangement one tall ink slab with two satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     dot grid, from "Inhalt zuerst, Werkzeuge bei Bedarf": 36 dots at a space-6 pitch on the border block, all in input (hidden) but three in foreground (revealed)
  scales      sides in space-4 multiples; gutters space-4; pitch space-6; corners radius-lg; dots r = 2px (half of space-1)
-->
<rect class="tint blk" x="32" y="120" width="160" height="144" rx="10"/>
<rect class="deep blk" x="208" y="-8" width="176" height="272" rx="10"/>
<rect class="mid blk"  x="400" y="48" width="96" height="216" rx="10"/>
<g id="dots"></g>
</svg>
</div>
<div class="words">
<h1 class="name">Stille</h1>
<p class="tag">Ruhig im Ruhezustand. Details erscheinen bei Bedarf.</p>
</div>
</div>
<script>
  (function () {
    var g = document.getElementById('dots'), ns = 'http://www.w3.org/2000/svg';
    var on = { '2,1': 1, '3,3': 1, '4,4': 1 };
    for (var r = 0; r < 6; r++) for (var c = 0; c < 6; c++) {
      var d = document.createElementNS(ns, 'circle');
      d.setAttribute('cx', 52 + c * 24); d.setAttribute('cy', 132 + r * 24); d.setAttribute('r', 2);
      d.setAttribute('class', on[c + ',' + r] ? 'dot on' : 'dot');
      g.appendChild(d);
    }
  })();
</script>
</body>
</html>
